name: CCT Monitor - consulta diaria

on:
  schedule:
    - cron: "0 9 * * 1-5"      # 06h00 em Brasilia (UTC-3), dias uteis
  workflow_dispatch:
    inputs:
      apenas_cnpj:
        description: "Rodar so para um CNPJ de sindicato (opcional)"
        required: false
        default: ""
      teste_email:
        description: "So testar o e-mail: informe um endereco e nada mais e executado"
        required: false
        default: ""

concurrency:
  group: cct-monitor
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install playwright requests beautifulsoup4 lxml
          playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Executar robo
        working-directory: robo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TENANT_CNPJ: "79876769000128"
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          MAIL_DESTINO_UNICO: ${{ secrets.MAIL_DESTINO_UNICO }}
          TESTE_EMAIL: ${{ inputs.teste_email }}
          APENAS_CNPJ: ${{ inputs.apenas_cnpj }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORIGEM: github-actions
        run: xvfb-run -a python monitor_cct.py
      - name: Guardar log e extratos da execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cct-monitor-${{ github.run_number }}
          path: |
            robo/resumo_execucao.json
            robo/extrato_*.doc
          if-no-files-found: ignore
          retention-days: 30
